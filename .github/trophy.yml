name: Generate Trophy

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ThiogoGambeta
          file: trophy.svg
          theme: radical
          max-cols: 7
          max-rows: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply custom cyan theme
        run: |
          python3 << 'EOF'
          from pathlib import Path

          arquivo = Path("trophy.svg")

          conteudo = arquivo.read_text()

          cores = {
              "#fe428e": "#00ffff",
              "#a9fef7": "#00ffff",
              "#50fa7b": "#00ffff",
          }

          for antiga, nova in cores.items():
              conteudo = conteudo.replace(antiga, nova)

          arquivo.write_text(conteudo)

          print("Tema #00ffff aplicado com sucesso.")
          EOF

      - name: Commit and push trophy.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add trophy.svg

          git diff --staged --quiet || git commit -m "chore: update trophy.svg"

          git push
